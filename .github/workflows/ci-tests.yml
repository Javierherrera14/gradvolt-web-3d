name: Pruebas Automáticas - GradVolt Web 3D

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    name: Ejecución de Pruebas Unitarias y de Integración
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar Node.js v20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Ejecutar pruebas automáticas (node:test)
        run: node --test tests/gradvolt.test.js
